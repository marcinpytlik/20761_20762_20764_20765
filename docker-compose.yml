version: "3.9"

services:
  sql2022:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql2022
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong!Passw0rd
    ports:
      - "14433:1433"
    volumes:
      # Całe /var/opt/mssql jako volume – entrypoint ustawi prawa dla usera mssql
      - sql2022_data:/var/opt/mssql
      # Backupy jako bind-mount z hosta (tylko odczyt/zapis .bak)
      - ./backups:/var/opt/mssql/backups
    restart: unless-stopped

volumes:
  sql2022_data:


version: "3.9"

services:
  sql2022:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql2022-sqlmaniak
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong!Passw0rd
      - MSSQL_PID=Developer
    ports:
      - "14333:1433"
    volumes:
      - sql2022_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  sql2022_data:
